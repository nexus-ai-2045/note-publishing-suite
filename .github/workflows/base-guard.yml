name: base-guard

# 必須チェック「base-guard」。pull_request_target なので、定義は比較元（保護された側）の版が動く。
# PR 側のコードは checkout も実行もしない。PR の commit を git の中身として読むだけ。
# 保護パスだけの変更は native Environment の人間レビューへ渡す。その他の不備は停止する。
# 停止するもの:
# preflight-gate の呼び出し先の owner/リポ違い、uses の @ と preflight-ref の不一致、呼び出しの削除、
# 版のタグ（v*）から辿れない SHA（フォーク網の SHA）。タグは ruleset で保護する（人の GO が要る設定）。
# 固定先: PREFLIGHT_REF は preflight.yml と同じ repo-preflight v0.10.0 の SHA。
# ruleset の必須チェック名は「base-guard」。job の name と一致させる。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'latest' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect base and PR
    permissions:
      contents: read
      actions: read
    outputs:
      review_required: ${{ steps.inspect.outputs.review_required }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PREFLIGHT_REF: 5b7c774deb8e9abcf0fce0c5f39ec1c1f3a894f3 # v0.10.0
    steps:
      - name: Require pinned repo-preflight SHA
        run: '[[ "$PREFLIGHT_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "PREFLIGHT_REF には 40桁の commit SHA を書いてください" >&2; exit 1; }'
      # 比較元だけを checkout する。PR 側は下で commit を取ってくるだけ（作業ツリーには出さない）
      - name: Check out base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out repo-preflight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: ${{ env.PREFLIGHT_REF }}
          path: tool
          persist-credentials: false
          # 版のタグ（v*）から辿れるかを見るため、全履歴とタグを取る（フォーク網の SHA を弾く。M5）
          fetch-depth: 0
          fetch-tags: true
      - name: Verify repo-preflight checkout matches the pinned SHA
        run: 'test "$(git -C tool rev-parse HEAD)" = "$PREFLIGHT_REF"'
      - name: Require PREFLIGHT_REF to be reachable from a release tag
        run: 'test -n "$(git -C tool tag --list "v[0-9]*" --contains "$PREFLIGHT_REF")" || { echo "PREFLIGHT_REF が repo-preflight の版のタグから辿れません" >&2; exit 1; }'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install hash-pinned PyYAML
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r tool/requirements-guard.txt
      - name: Fetch PR commit without checking it out
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_FETCH_TOKEN: ${{ github.token }}
        run: |
          set +ax
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$EVENT_FETCH_TOKEN" | base64 | tr -d '\r\n')"
          unset EVENT_FETCH_TOKEN
          GIT_CONFIG_COUNT=2 \
          GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL%/}/.extraheader" \
          GIT_CONFIG_VALUE_0="$auth_header" \
          GIT_CONFIG_KEY_1=credential.helper \
          GIT_CONFIG_VALUE_1='' \
          GIT_TERMINAL_PROMPT=0 \
            git -C target fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          unset auth_header
          test "$(git -C target rev-parse 'refs/remotes/pr/head^{commit}')" = "$HEAD_SHA"
      - name: Inspect guard report and required reviewer policy
        id: inspect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          OWNER_ID: ${{ github.repository_owner_id }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REVIEW_API_TOKEN: ${{ github.token }}
        run: |
          python -I target/.github/scripts/base_guard_review.py --repo target --tool tool \
            --base "$BASE_SHA" --head "$HEAD_SHA" --pr "$PR_NUMBER" \
            --repository "$REPOSITORY" --owner-id "$OWNER_ID" --owner-type "$OWNER_TYPE"

  owner-review:
    name: Review PR ${{ github.event.pull_request.number }} head ${{ github.event.pull_request.head.sha }}
    needs: inspect
    if: needs.inspect.result == 'success' && needs.inspect.outputs.review_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    environment:
      name: ci-protected-change-review
      url: ${{ format('{0}/{1}/compare/{2}...{3}', github.server_url, github.repository, github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
    steps:
      - name: Record native review completion
        run: echo 'GitHub Environment の確認が完了しました。公開・リリースは行いません。'

  base-guard:
    name: base-guard
    needs: [inspect, owner-review]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all applicable checks
        env:
          INSPECT_RESULT: ${{ needs.inspect.result }}
          REVIEW_REQUIRED: ${{ needs.inspect.outputs.review_required }}
          REVIEW_RESULT: ${{ needs.owner-review.result }}
        run: |
          set -euo pipefail
          test "$INSPECT_RESULT" = success
          case "$REVIEW_REQUIRED:$REVIEW_RESULT" in
            false:skipped|true:success) echo 'base-guard: pass' ;;
            *) echo 'base-guard: 必要な検査または本人確認が未完了です' >&2; exit 1 ;;
          esac
