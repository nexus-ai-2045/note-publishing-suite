name: test

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["master", "main"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      base_ref:
        description: "差分選択の比較元（不明な場合は停止）"
        default: ""
        required: true

# workflow/eventを分け、古いPR検証だけを止める。差分単位のmain/tag/release/手動は保持する。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && 'latest' || format('{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # テストの内容・環境はNPS policyが所有し、選択処理だけ固定版を参照する。
  TEST_SELECTOR_REF: "0d220f19256bd3edcca014d14091f66cd64ccfb1"
  TEST_SELECTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}

jobs:
  writing-ui:
    name: 共同執筆画面の検査
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: writing-app
    steps:
      - name: ソースを取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: 共同執筆画面への変更を確認
        id: writing-impact
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          base = os.environ.get("CHANGE_BASE", "")
          relevant = True
          if (os.environ["CHANGE_EVENT"] in {"pull_request", "push"}
                  and not os.environ.get("CHANGE_REF", "").startswith("refs/tags/")
                  and re.fullmatch(r"[0-9a-f]{40}", base)
                  and subprocess.run(["git", "cat-file", "-e", base + "^{commit}"],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0):
              # rename元の削除も含める。比較不能・初回push・手動・releaseは省略しない。
              changed = subprocess.check_output([
                  "git", "diff", "--no-ext-diff", "--no-textconv", "--no-renames",
                  "--name-only", "-z", base, "HEAD", "--",
              ]).split(b"\0")
              shared = {b".github/workflows/test.yml", b".npmrc", b".nvmrc",
                        b"package.json", b"package-lock.json", b"pnpm-lock.yaml"}
              relevant = any(path.startswith(b"writing-app/") or path in shared for path in changed if path)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("relevant=" + str(relevant).lower() + "\n")
          print("共同執筆画面: " + ("検査を実行" if relevant else "対象変更なし（必須jobは完了）"))
          PY
      - name: Node.jsを準備
        if: steps.writing-impact.outputs.relevant == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: writing-app/package-lock.json
      - name: 固定した依存を導入
        if: steps.writing-impact.outputs.relevant == 'true'
        run: npm ci
      - name: 原文保持とAPI接続の試験
        if: steps.writing-impact.outputs.relevant == 'true'
        run: npm test
      - name: 型検査と画面build
        if: steps.writing-impact.outputs.relevant == 'true'
        run: npm run build

  repository-guarantees:
    uses: ./.github/workflows/repository-guarantees.yml
    with:
      pipeline_call: true
    secrets:
      NPS_PRIVATE_IDENTITY_DENYLIST: ${{ secrets.NPS_PRIVATE_IDENTITY_DENYLIST }}
      NPS_PRIVATE_IDENTITY_PATTERNS: ${{ secrets.NPS_PRIVATE_IDENTITY_PATTERNS }}

  package-smoke:
    needs: repository-guarantees
    name: package-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nps
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: nps
          fetch-depth: 0

      - name: 共通selectorの固定版を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: ${{ env.TEST_SELECTOR_REF }}
          path: selector
          persist-credentials: false

      - name: selectorの固定版を照合
        run: python -c "import os, subprocess; assert subprocess.check_output(['git', '-C', '../selector', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['TEST_SELECTOR_REF']"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Set up Node for guarded URL input tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python static lint
        run: python -m ruff check scripts tests

      - name: Run package contract tests
        run: python scripts/run_selected_tests.py --selector-script ../selector/scripts/local_check.py --base-ref "$TEST_SELECTION_BASE" --receipt "${{ runner.temp }}/nps-test-selection.json"

      - name: Check package SSOT pointer targets
        run: python scripts/skill_pointer_check.py --json

      - name: Run package version bump guard
        env:
          # PR では base と HEAD の版差を検査する。dispatch/push ではスキップ可。
          VERSION_BUMP_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: python scripts/check_version_bump.py

      - name: Run Note editor prepublish observation checker
        run: |
          python scripts/note_editor_prepublish_verify.py data/note_editor_prepublish_observation.fixture.json --json > /tmp/note-editor-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/note-editor-result.json").read_text(encoding="utf-8"))
          assert result["ok"] is True, result
          assert result["ready_for_publish"] is False
          assert result["live_dom_verified"] is False, result
          assert result["external_actions_performed"] == [], result
          assert result["publication_actions_performed"] == [], result
          PY

      - name: Run clean-machine public package verifier
        run: sh scripts/verify_public_package.sh

      # 上記verifierがprovenance・名義・日本語・画像境界を実行する。同じCLIを再実行しない。

      - name: 選択根拠を保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nps-python-test-selection
          path: ${{ runner.temp }}/nps-test-selection.json

  windows-installer-smoke:
    name: windows-installer-smoke
    runs-on: windows-latest
    defaults:
      run:
        working-directory: nps
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: nps
          fetch-depth: 0

      - name: 共通selectorの固定版を取得
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: nexus-ai-2045/repo-preflight
          ref: ${{ env.TEST_SELECTOR_REF }}
          path: selector
          persist-credentials: false

      - name: selectorの固定版を照合
        run: python -c "import os, subprocess; assert subprocess.check_output(['git', '-C', '../selector', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['TEST_SELECTOR_REF']"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Windows検査の対象を選択
        id: selection
        shell: pwsh
        run: python scripts/run_selected_tests.py --selector-script ../selector/scripts/local_check.py --base-ref "$env:TEST_SELECTION_BASE" --environment windows --plan-only --github-output "$env:GITHUB_OUTPUT" --receipt "${{ runner.temp }}/nps-windows-test-selection.json"

      - name: Install test dependencies
        if: steps.selection.outputs.native_required == 'true'
        run: python -m pip install -r requirements-dev.txt

      - name: Run Windows installer tests
        if: steps.selection.outputs.native_required == 'true'
        shell: pwsh
        run: python scripts/run_selected_tests.py --selector-script ../selector/scripts/local_check.py --base-ref "$env:TEST_SELECTION_BASE" --environment windows --receipt "${{ runner.temp }}/nps-windows-test-selection.json"

      - name: Check package SSOT pointer targets
        if: steps.selection.outputs.native_required == 'true'
        run: python scripts/skill_pointer_check.py --json

      - name: Run Windows clean-machine public package verifier
        if: steps.selection.outputs.native_required == 'true'
        shell: pwsh
        run: .\scripts\verify_public_package.ps1

      - name: 選択根拠を保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nps-windows-test-selection
          path: ${{ runner.temp }}/nps-windows-test-selection.json

  docs-sync:
    name: docs-sync
    # PR 専用。push/dispatch では不要で、並列キャンセルの誤 fail を避ける。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Extract pull request review text
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          body = (event.get("pull_request") or {}).get("body") or ""
          Path("/tmp/docs-sync-review.txt").write_text(body, encoding="utf-8")
          PY

      - name: Run read-only docs sync checker
        id: check
        shell: bash
        run: |
          set +e
          BASE_REF="origin/${GITHUB_BASE_REF:-main}"
          python scripts/docs_sync_check.py \
            --base-ref "$BASE_REF" \
            --review-file /tmp/docs-sync-review.txt \
            --json-out build/docs-sync/result.json \
            --patch-out build/docs-sync/generated.patch
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload docs sync evidence
        if: steps.check.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docs-sync-evidence
          path: build/docs-sync/

      - name: Enforce docs sync result
        if: steps.check.outputs.status != '0'
        run: exit 1
