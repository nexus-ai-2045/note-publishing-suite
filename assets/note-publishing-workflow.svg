<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Note Publishing Suite の基本ワークフロー</title>
  <desc id="desc">素材からNote下書き保存までは自動化し、公開直前で停止して人が判断する流れ</desc>
  <rect width="1600" height="430" rx="24" fill="#f6f8fa"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif">
    <text x="64" y="72" fill="#57606a" font-size="20" font-weight="600" letter-spacing="2">DRAFT WORKFLOW</text>
    <text x="64" y="118" fill="#1f2328" font-size="30" font-weight="700">下書きを整え、公開直前で止まる。</text>

    <path d="M160 248H1328" fill="none" stroke="#8c959f" stroke-width="4"/>

    <g text-anchor="middle">
      <g transform="translate(140 248)">
        <circle r="52" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
        <text y="-5" fill="#57606a" font-size="16" font-weight="700">01</text>
        <text y="24" fill="#1f2328" font-size="22" font-weight="700">素材</text>
      </g>
      <g transform="translate(380 248)">
        <circle r="52" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
        <text y="-5" fill="#57606a" font-size="16" font-weight="700">02</text>
        <text y="24" fill="#1f2328" font-size="22" font-weight="700">記事候補</text>
      </g>
      <g transform="translate(620 248)">
        <circle r="52" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
        <text y="-5" fill="#57606a" font-size="16" font-weight="700">03</text>
        <text y="24" fill="#1f2328" font-size="22" font-weight="700">下書き</text>
      </g>
      <g transform="translate(860 248)">
        <circle r="52" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
        <text y="-5" fill="#57606a" font-size="16" font-weight="700">04</text>
        <text y="24" fill="#1f2328" font-size="22" font-weight="700">QA</text>
      </g>
      <g transform="translate(1100 248)">
        <circle r="58" fill="#1f2328"/>
        <text y="-7" fill="#b6bec9" font-size="16" font-weight="700">05</text>
        <text y="22" fill="#ffffff" font-size="20" font-weight="700">Note下書き</text>
      </g>
    </g>

    <g fill="#1f2328">
      <path d="m261 236 16 12-16 12v-8h-34v-8h34z"/>
      <path d="m501 236 16 12-16 12v-8h-34v-8h34z"/>
      <path d="m741 236 16 12-16 12v-8h-34v-8h34z"/>
      <path d="m981 236 16 12-16 12v-8h-34v-8h34z"/>
    </g>

    <line x1="1286" y1="164" x2="1286" y2="338" stroke="#cf222e" stroke-width="6"/>
    <rect x="1210" y="130" width="152" height="42" rx="21" fill="#cf222e"/>
    <text x="1286" y="158" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1">HUMAN REVIEW</text>

    <g transform="translate(1430 248)" text-anchor="middle">
      <circle r="52" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 8"/>
      <text y="8" fill="#57606a" font-size="22" font-weight="700">公開</text>
    </g>
    <path d="M1330 248h42" fill="none" stroke="#8c959f" stroke-width="4" stroke-dasharray="8 8"/>

    <text x="1286" y="376" fill="#cf222e" font-size="22" font-weight="800" text-anchor="middle">ここで停止</text>
    <text x="1430" y="376" fill="#57606a" font-size="18" font-weight="600" text-anchor="middle">人が判断</text>
  </g>
</svg>
